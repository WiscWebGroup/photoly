[project]
name = "photoly-inference-mps"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask==3.1.2",
  "Werkzeug==3.1.3",
  "Flask-SQLAlchemy==3.1.1",
  "SQLAlchemy==2.0.43",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pgvector>=0.4,<0.5",
  "redis==6.4.0",
  "gunicorn==23.0.0",
  "Pillow==11.3.0",
  "qrcode==8.2",
  "psutil>=7,<8",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "qwen-vl-utils==0.0.14",
  "numpy>=2,<3",
  "sentencepiece>=0.2,<0.3",
  "protobuf>=5,<7",
  "python-dotenv==1.1.1"
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
