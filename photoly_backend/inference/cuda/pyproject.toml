[project]
name = "photoly-inference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.3", "accelerate==1.12.0", "qwen-vl-utils==0.0.14", "Pillow==11.3.0", "Flask==3.1.2", "numpy>=2,<3", "psutil>=7,<8", "nvidia-ml-py>=12,<14", "sentencepiece>=0.2,<0.3", "protobuf>=5,<7"]
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
