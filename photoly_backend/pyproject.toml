[project]
name = "photoly-backend"
version = "2.0.0"
description = "Photoly Flask backend with the legacy Spring API contract"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.2",
  "Werkzeug==3.1.3",
  "Flask-SQLAlchemy==3.1.1",
  "SQLAlchemy==2.0.43",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pgvector>=0.4,<0.5",
  "redis==6.4.0",
  "gunicorn==23.0.0",
  "Pillow==11.3.0",
  "qrcode==8.2",
  "psutil>=7,<8",
  "pillow-heif>=1.1,<2",
  "urllib3>=2.6,<3",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==6.2.1",
    "fakeredis==2.31.1",
    "requests==2.34.2",
    "zxing-cpp==3.1.1",
    "openapi-spec-validator==0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not http'"
markers = ["integration: requires isolated PostgreSQL and Redis", "http: requires a running disposable Gunicorn container"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
