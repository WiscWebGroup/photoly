[project]
name = "photoly-backend"
version = "2.0.0"
description = "Photoly Flask backend with the legacy Spring API contract"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.2",
  "Werkzeug==3.1.3",
  "Flask-SQLAlchemy==3.1.1",
  "SQLAlchemy==2.0.43",
  "PyMySQL[rsa]==1.1.2",
  "redis==6.4.0",
  "gunicorn==23.0.0",
  "Pillow==11.3.0",
  "qrcode==8.2",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.1.0",
    "fakeredis==2.31.1",
    "requests==2.32.5",
    "zxing-cpp==3.1.1",
    "openapi-spec-validator==0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not http'"
markers = ["integration: requires isolated MySQL and Redis", "http: requires a running disposable Gunicorn container"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
