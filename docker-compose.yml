# One backend container: photoly + PostgreSQL (pgvector) together, plus the nginx web container.
#   docker compose up --build
# Data: ./upload_data (photos, owned by uid 65532) and the `postgres_data` volume.
# The `backend` service name is what photoly_frontend_vue/nginx.conf proxies to.
services:
  web:
    depends_on:
      backend:
        condition: service_healthy
    build: ./photoly_frontend_vue
    ports:
      - "5200:80"
  backend:
    build:
      context: ./photoly_server
      target: aio
      additional_contexts:
        dbinit: ./database/postgres-init
    ports:
      - "8384:8084"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@a.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8384}
      TIMEZONE: ${TIMEZONE:-America/New_York}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-629145600}
      UPLOAD_ZIP_MAX_BYTES: ${UPLOAD_ZIP_MAX_BYTES:-50000000000}
      UPLOAD_DISK_RESERVE_BYTES: ${UPLOAD_DISK_RESERVE_BYTES:-536870912}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_CACHE_TTL: ${STORAGE_CACHE_TTL:-24h}
    volumes:
      - ./upload_data:/photoly
      - photoly_models:/var/lib/photoly
      - postgres_data:/var/lib/postgresql/data
    stop_grace_period: 60s
    restart: unless-stopped
volumes:
  photoly_models:
  postgres_data:
