# Try the POC:  docker compose up -d --build   then open http://localhost:8084
#
# The POC has no sign-in, so the port is published on 127.0.0.1 only. WebGPU also needs a
# secure context: http://localhost works; other machines need HTTPS (see README).
name: photoly-poc

services:
  photoly:
    build: .
    image: photoly-poc:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://photoly:${POC_DB_PASSWORD:-photoly-poc}@db:5432/photoly
      PHOTOLY_MODEL_DTYPE: ${PHOTOLY_MODEL_DTYPE:-fp32}
    ports:
      - "127.0.0.1:${POC_PORT:-8084}:8084"
    volumes:
      - photoly_data:/data
    restart: unless-stopped

  # Same pinned pgvector image as Photoly's main docker-compose.yml.
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: photoly
      POSTGRES_PASSWORD: ${POC_DB_PASSWORD:-photoly-poc}
      POSTGRES_DB: photoly
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoly -d photoly"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  photoly_data:
  db_data:
