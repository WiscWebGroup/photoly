# Opt-in only: replaces deterministic runtime in the disposable test project.
services:
  ai-runtime:
    image: photoly-ai-runtime:phase2
    build: !reset null
    environment:
      AI_TEST_RUNTIME: "0"
    volumes:
      - real_model_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  real_model_cache:
    external: true
    name: photoly_ai_models
