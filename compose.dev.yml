# Backend only (photoly + PostgreSQL in one container) for working on the frontend:
#   docker compose -f compose.dev.yml up -d --build
#   cd photoly_frontend_vue && pnpm dev     # proxies /api and /models to localhost:8384
services:
  backend:
    extends:
      file: docker-compose.yml
      service: backend
    volumes:
      # Named volume, not ./upload_data: some macOS runtimes' bind mounts report a new
      # inode on every stat, which trips the folder/root identity guards.
      - photoly_uploads:/photoly
volumes:
  photoly_backups:
  photoly_models:
  photoly_uploads:
  postgres_data:
