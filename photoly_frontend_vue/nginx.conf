server {
    # Resolve again after backend container replacement, without restarting web.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://${BACKEND_UPSTREAM};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend enforces its configurable per-request upload limit.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SigLIP2 model files for browser AI, served by the Photoly backend (immutable per revision).
    location /models/ {
        set $backend http://${BACKEND_UPSTREAM};
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Cross-origin isolation for WebAssembly threads in browser AI. `credentialless` (not
        # `require-corp`) keeps Leaflet's cross-origin map tiles loading. Without isolation the
        # app runs the model on one thread. Repeated here: add_header is not inherited.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # Hashed build output (including the ONNX Runtime engine) never changes.
    location /assets/ {
        root /usr/share/nginx/html/;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
