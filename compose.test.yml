# Disposable databases; no published ports or production data mounts.
x-http-environment: &http-environment
  POSTGRES_HOST: postgres
  POSTGRES_DB: photoly_http_test
  POSTGRES_APP_PASSWORD: test-app-only
  REDIS_URL: redis://redis:6379/14
  UPLOAD_FOLDER: /photoly
  AI_RUNTIME_URL: http://ai-runtime:8090
  AI_INFERENCE_TOKEN: test-inference-only
  ADMIN_EMAIL: admin@test.local
  PUBLIC_BASE_URL: http://backend:8084
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: photoly_test
      POSTGRES_EXTRA_DATABASE: photoly_http_test
      POSTGRES_PASSWORD: test-root-only
      POSTGRES_APP_PASSWORD: test-app-only
      POSTGRES_MIGRATION_PASSWORD: test-migration-only
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./database/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d photoly_test"]
      interval: 2s
      timeout: 5s
      retries: 60
  redis:
    image: redis:7.2.4
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  tests:
    build:
      context: ./photoly_backend
      target: test
    entrypoint: []
    command: ["pytest", "-q", "--cov=app", "--cov-report=term-missing"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://photoly:test-app-only@postgres:5432/photoly_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://photoly_migrator:test-migration-only@postgres:5432/photoly_test
      TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  migrate:
    build:
      context: ./photoly_backend
      target: production
    entrypoint: ["/app/migrate.sh"]
    healthcheck:
      disable: true
    environment:
      <<: *http-environment
      POSTGRES_MIGRATION_PASSWORD: test-migration-only
      ADMIN_PASSWORD: test-password-only
    volumes:
      - test_media:/photoly
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  backend:
    build:
      context: ./photoly_backend
      target: production
    environment: *http-environment
    volumes:
      - test_media:/photoly
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  smoke:
    build:
      context: ./photoly_backend
      target: test
    entrypoint: []
    command: ["pytest", "-q", "tests/test_ai_http.py", "tests/test_http.py", "-m", "http"]
    environment:
      PHOTOLY_TEST_HTTP_URL: http://backend:8084
    depends_on:
      backend:
        condition: service_healthy
      ai-scheduler:
        condition: service_started
      ai-maintenance:
        condition: service_started

  ai-runtime:
    build:
      context: ./photoly_backend
      target: test
    entrypoint: ["python", "-m", "app.ai.runtime"]
    environment:
      AI_TEST_RUNTIME: "1"
      AI_INFERENCE_TOKEN: test-inference-only
      AI_CONTROL_TOKEN: test-control-only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8090/status',headers={'Authorization':'Bearer test-inference-only'}))"]
      interval: 2s
      timeout: 5s
      retries: 30
  ai-scheduler:
    build:
      context: ./photoly_backend
      target: production
    entrypoint: ["python", "-m", "app.scheduler.photo_embedding_scheduler"]
    environment:
      <<: *http-environment
      AI_CONTROL_TOKEN: test-control-only
    volumes:
      - test_media:/photoly:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-runtime:
        condition: service_healthy
    healthcheck:
      disable: true
  ai-maintenance:
    build:
      context: ./photoly_backend
      target: production
    entrypoint: ["python", "-m", "app.scheduler.maintenance"]
    environment:
      <<: *http-environment
      POSTGRES_MIGRATION_PASSWORD: test-migration-only
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
volumes:
  test_media:
