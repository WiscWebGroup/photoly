version: 2
updates:
  - package-ecosystem: gomod
    directory: /photoly_server
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /photoly_frontend_vue
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /photoly_server
      - /photoly_frontend_vue
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
