version: 2
updates:
  - package-ecosystem: uv
    directory: /photoly_backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /photoly_frontend_vue
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /photoly_backend
      - /photoly_frontend_vue
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
