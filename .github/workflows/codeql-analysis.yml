name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '37 11 * * 4'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          # Go module in photoly_server/ (cgo for ONNX Runtime; the library is loaded at runtime, not at build).
          - language: go
            build-mode: autobuild

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v6
      if: matrix.language == 'go'
      with:
        go-version-file: photoly_server/go.mod
        cache-dependency-path: photoly_server/go.sum

    - uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
