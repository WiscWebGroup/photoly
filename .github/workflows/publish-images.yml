name: Publish images

# Builds the backend (aio) and web images and pushes them to GHCR for deployments that
# can't or shouldn't build from source (e.g. the demo stack in docker-compose.demo.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    # arm64 only, built natively (no QEMU). Add an amd64 job + manifest merge if x86 hosts need it.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - image: photoly-backend
            context: photoly_server
            target: aio
            build-contexts: dbinit=database/postgres-init
          - image: photoly-web
            context: photoly_frontend_vue
            target: ''
            build-contexts: ''
    steps:
      - uses: actions/checkout@v7
      - id: ref
        # GHCR names must be lowercase; the org is not.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact runtime image
        env:
          IMAGE: ${{ steps.ref.outputs.name }}
          CONTEXT: ${{ matrix.context }}
          TARGET: ${{ matrix.target }}
          EXTRA_CONTEXT: ${{ matrix.build-contexts }}
        run: |
          args=()
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          if [ -n "$EXTRA_CONTEXT" ]; then args+=(--build-context "$EXTRA_CONTEXT"); fi
          docker buildx build --builder default --load "${args[@]}" \
            --build-arg PHOTOLY_REVISION="$GITHUB_SHA" \
            --build-arg PHOTOLY_SOURCE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/sources-$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" "$CONTEXT"
      - name: Collect and verify corresponding sources before publishing binaries
        env:
          IMAGE: ${{ steps.ref.outputs.name }}
        run: |
          docker buildx build --builder default \
            --build-arg RUNTIME_IMAGE="$IMAGE:$GITHUB_SHA" \
            --output type=local,dest=compliance-output \
            -f scripts/compliance/sources.Dockerfile scripts/compliance
          test -f compliance-output/system/COMPLETE
          git archive --format=tar --prefix=photoly/ HEAD | gzip -n > compliance-output/photoly-source.tar.gz
          docker image inspect "$IMAGE:$GITHUB_SHA" --format '{"id":{{json .Id}},"architecture":{{json .Architecture}},"os":{{json .Os}},"rootfs":{{json .RootFS}}}' > compliance-output/image.json
          image_id=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{.Id}}')
          archive="${{ matrix.image }}-${image_id#sha256:}-sources.tar.gz"
          source_epoch=$(git show -s --format=%ct HEAD)
          tar --sort=name --mtime="@$source_epoch" --owner=0 --group=0 --numeric-owner -czf "$archive" -C compliance-output .
          sha256sum "$archive" > "$archive.sha256"
          # GitHub release assets have a 2 GiB limit; retain every build's immutable sources.
          split -b 1800m -d -a 3 "$archive" "$archive.part-"
          printf '%s\n' "Concatenate the numbered parts in order, then verify the .sha256 file before extracting. The filename identifies the Docker image config ID; image.json records the full build identity." > "$archive.README.txt"
          echo "SOURCE_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Publish durable source archives, then images
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.ref.outputs.name }}
        run: |
          tag="sources-$GITHUB_SHA"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --target "$GITHUB_SHA" --title "Source archives $GITHUB_SHA" \
              --notes "Corresponding source archives, notices and exact package records for the images built from this revision. Retain these assets while the images are distributed." || \
            gh release view "$tag" >/dev/null
          # A rerun may encounter the identical immutable archive; compare before reuse.
          for file in "$SOURCE_ARCHIVE".part-* "$SOURCE_ARCHIVE.sha256" "$SOURCE_ARCHIVE.README.txt"; do
            if ! gh release upload "$tag" "$file"; then
              mkdir -p /tmp/published-sources
              gh release download "$tag" --pattern "$file" --dir /tmp/published-sources --clobber
              cmp "$file" "/tmp/published-sources/$file"
            fi
          done
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
