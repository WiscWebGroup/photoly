name: Frontend preview

# Builds the frontend for each PR and publishes it to Cloudflare Pages as pr-<n>. /api and /models are
# proxied to the deployed demo backend by Pages Functions. Needs secrets CLOUDFLARE_API_TOKEN (Pages edit)
# and CLOUDFLARE_ACCOUNT_ID, and repo variables PREVIEW_PAGES_PROJECT (Pages project name) and
# DEMO_BACKEND_URL (demo origin, e.g. https://demo.example.com, no trailing slash).
on:
  pull_request:
    paths: ['photoly_frontend_vue/**', '.github/preview/**', '.github/workflows/frontend-preview.yml']

permissions:
  contents: read

concurrency:
  group: frontend-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork PRs have no access to the Cloudflare secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.PREVIEW_PAGES_PROJECT }}
      BACKEND: ${{ vars.DEMO_BACKEND_URL }}
      BRANCH_NAME: pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: photoly_frontend_vue/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: photoly_frontend_vue/pnpm-lock.yaml
      - name: Build
        working-directory: photoly_frontend_vue
        run: |
          pnpm install --frozen-lockfile
          VITE_APP_BASE_URL=/api pnpm build
      - name: Assemble site
        run: |
          : "${BACKEND:?Set the DEMO_BACKEND_URL repository variable}"
          : "${PROJECT_NAME:?Set the PREVIEW_PAGES_PROJECT repository variable}"
          mkdir -p site/functions
          cp -r photoly_frontend_vue/dist site/dist
          cp .github/preview/_headers site/dist/_headers
          for prefix in api models; do
            mkdir -p "site/functions/$prefix"
            sed -e "s|__BACKEND__|${BACKEND%/}|" -e "s|__PREFIX__|$prefix|g" .github/preview/proxy.js > "site/functions/$prefix/[[path]].js"
          done
          # Pages rejects files over 25 MiB. The in-browser AI engine is too big, so previews use server AI.
          find site/dist -type f -size +25M -print -delete
      - name: Deploy
        working-directory: site
        run: |
          npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main || true
          npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT_NAME" --branch "$BRANCH_NAME"
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://${{ env.BRANCH_NAME }}.${{ vars.PREVIEW_PAGES_PROJECT }}.pages.dev
        run: |
          body="Frontend preview: $URL (talks to the demo backend; in-browser AI is unavailable)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.number }}/comments" --jq '[.[] | select(.body | startswith("Frontend preview:"))][0].id // empty')
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          else gh pr comment ${{ github.event.number }} --body "$body"; fi
