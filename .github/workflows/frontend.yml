name: Frontend

on:
  push:
    branches: [main]
    paths: ['photoly_frontend_vue/**', '.github/workflows/frontend.yml']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: photoly_frontend_vue

jobs:
  # Always runs on PRs (no `paths` filter) so required checks report; skipped jobs count as passing.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'photoly_frontend_vue/**'
              - '.github/workflows/frontend.yml'

  check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: photoly_frontend_vue/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: photoly_frontend_vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: photoly_frontend_vue/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: photoly_frontend_vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - name: Check editor and dialogs with the Docker API prefix
        run: pnpm exec playwright test e2e/editor.spec.ts e2e/dialog-overflow.spec.ts
        env:
          VITE_APP_BASE_URL: /api
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: photoly_frontend_vue/playwright-report
